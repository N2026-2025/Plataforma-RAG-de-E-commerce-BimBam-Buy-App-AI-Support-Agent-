<!DOCTYPE html>
<html lang="es" data-bs-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>BimBam Buy · Asistente IA de Soporte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-ENjdO4Dr2bIBIl7T4eXFOT9RUpK45s8M5qF3PKc6e8nKcD8PkQM6UhRZ6MUdGK" crossorigin="anonymous">

  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
    }

    /* Custom overrides for BimBam Buy branding */
    .brand-logo svg { color: var(--primary); }
    .brand-info h1 { color: var(--primary); }
    
    /* Chip custom styling */
    .chip-custom { 
      background: rgba(99, 102, 241, 0.1); 
      border: 1px solid var(--primary);
      color: var(--primary);
    }
    .chip-custom:hover { 
      background: var(--primary); 
      color: white; 
    }

    /* Focus styles */
    .form-control:focus, .form-select:focus {
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    /* Send button */
    .btn-send {
      background: var(--primary-gradient);
      border-color: var(--primary);
      color: white;
    }
    .btn-send:hover:not(:disabled) {
      background: #4f46e5;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }
    .btn-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Feedback buttons */
    .btn-feedback { color: #64748b; border-color: #e2e8f0; }
    .btn-feedback:hover:not(:disabled) { background: #f1f5f9; color: #1e293b; }
    .btn-feedback:disabled { opacity: 0.6; cursor: default; }

    /* Expander */
    .stExpander { --bs-expander-color: var(--bs-body-color); }
  </style>
</head>
<body>

  <!-- Bootstrap 5 JS Bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenW7Z3G1gMw+zqZmB2mOTwYc5fJpNE5Y+wIy+2EIgXdKlnZ8GfyFyQNtShUQYwMp" crossorigin="anonymous"></script>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">
        <div class="brand-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="24" height="24" rx="8" fill="url(#grad)"/>
            <text x="12" y="16" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">BB</text>
            <defs>
              <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6366f1"/>
                <stop offset="100%" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span>BimBam Buy AI</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarnav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/docs" target="_blank" title="Ver documentación de API">📖 Docs</a>
          </li>
          <li class="nav-item">
            <button class="btn btn-light btn-sm" onclick="resetSession()" title="Reiniciar sesión de chat">🔄 Nueva conversación</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid mt-5">
    <div class="row">
      <div class="col-12">
        <div class="welcome-card mb-4">
          <h2>¡Hola! 👋 Te damos la bienvenida a BimBam Buy</h2>
          <p>Soy tu agente de soporte inteligente. Respondé tus dudas sobre envíos, pagos, devoluciones, garantías y más.</p>
          <div class="chips mb-3">
            <button class="chip chip-custom me-2" onclick="askChip(this)">📦 ¿Cuánto tarda el envío y cómo lo rastreo?</button>
            <button class="chip chip-custom me-2" onclick="askChip(this)">🔄 ¿Cómo solicito una devolución o reembolso?</button>
            <button class="chip chip-custom me-2" onclick="askChip(this)">💳 ¿Cuáles son los métodos de pago aceptados?</button>
            <button class="chip chip-custom me-2" onclick="askChip(this)">🛡️ ¿Qué cobertura tiene la garantía?</button>
            <button class="chip chip-custom" onclick="askChip(this)">📍 ¿Dónde está mi pedido?</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <div class="chat-container" id="chatContainer">
          <!-- Mensajes se insertan aquí por JS -->
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <div class="input-area">
          <div class="input-wrapper">
            <input 
              type="text" 
              id="questionInput" 
              placeholder="Escribí tu consulta aquí..." 
              autocomplete="off"
              onkeydown="handleKey(event)"
              class="form-control"
            />
            <button class="btn btn-send ms-2" id="sendBtn" onclick="sendQuestion()" title="Enviar mensaje">
              ➤
            </button>
          </div>
          <div class="footer-note mt-2">
            Respuestas generadas por IA basadas en la base de conocimiento oficial de BimBam Buy.
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let sessionId = localStorage.getItem('bimbam_session_id');
    if (!sessionId) {
      sessionId = 'session_' + Math.random().toString(36).substring(2, 11);
      localStorage.setItem('bimbam_session_id', sessionId);
    }

    const chatContainer = document.getElementById('chatContainer');
    const questionInput = document.getElementById('questionInput');
    const sendBtn = document.getElementById('sendBtn');
    const welcomeCard = document.getElementById('welcomeCard');

    function resetSession() {
      sessionId = 'session_' + Math.random().toString(36).substring(2, 11);
      localStorage.setItem('bimbam_session_id', sessionId);
      chatContainer.innerHTML = '';
      if (welcomeCard) chatContainer.appendChild(welcomeCard);
      questionInput.focus();
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendQuestion();
      }
    }

    function askChip(btn) {
      const text = btn.innerText.replace(/^[^\w¿?]+/, '').trim();
      questionInput.value = text;
      sendQuestion();
    }

    function formatText(text) {
      if (!text) return '';
      // Simple markdown parser for bold, italic and bullet lists
      let html = text
        .replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">")
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');

      // Paragraphs and lists
      const lines = html.split('\n');
      let inList = false;
      let result = [];

      for (let line of lines) {
        let trimmed = line.trim();
        if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
          if (!inList) { result.push('<ul>'); inList = true; }
          result.push(`<li>${trimmed.substring(2)}</li>`);
        } else {
          if (inList) { result.push('</ul>'); inList = false; }
          if (trimmed.length > 0) {
            result.push(`<p>${line}</p>`);
          }
        }
      }
      if (inList) result.push('</ul>');
      return result.join('');
    }

    async function sendQuestion() {
      const q = questionInput.value.trim();
      if (!q) return;

      questionInput.value = '';
      questionInput.disabled = true;
      sendBtn.disabled = true;

      // Add user bubble
      appendMessage('user', q);

      // Add typing indicator
      const typingEl = appendTypingIndicator();
      scrollToBottom();

      try {
        const resp = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q, session_id: sessionId })
        });

        if (!resp.ok) {
          const errData = await resp.json().catch(() => ({}));
          throw new Error(errData.detail || 'Error al comunicarse con el servidor (' + resp.status + ')');
        }

        const data = await resp.json();
        typingEl.remove();

        appendBotMessage(data);
      } catch (err) {
        typingEl.remove();
        appendMessage('bot', '⚠️ Lo siento, ocurrió un error: ' + err.message);
      } finally {
        questionInput.disabled = false;
        sendBtn.disabled = false;
        questionInput.focus();
        scrollToBottom();
      }
    }

    function appendMessage(role, text) {
      const row = document.createElement('div');
      row.className = `message-row ${role}`;
      row.innerHTML = `
        ${role === 'bot' ? '<div class="msg-avatar">🤖</div>' : ''}
        <div class="msg-bubble">${formatText(text)}</div>
      `;
      chatContainer.appendChild(row);
      scrollToBottom();
      return row;
    }

    function appendBotMessage(data) {
      const row = document.createElement('div');
      row.className = 'message-row bot';

      const sourcesHtml = (data.sources && data.sources.length > 0)
        ? `<div class="sources-box">
             <span>📚 Fuentes:</span>
             ${data.sources.map(s => `<span class="source-tag">📄 ${s}</span>`).join('')}
           </div>`
        : '';

      const timingSec = data.timings_ms && data.timings_ms.total
        ? (data.timings_ms.total / 1000).toFixed(1) + 's'
        : null;

      const metaHtml = `
        <div class="meta-box">
          <span>${timingSec ? '⚡ ' + timingSec : ''}</span>
          ${data.interaction_id ? `
            <div class="feedback-group">
              <span>¿Fue útil?</span>
              <button class="btn-feedback" onclick="sendFeedback(${data.interaction_id}, 1, this)">👍</button>
              <button class="btn-feedback" onclick="sendFeedback(${data.interaction_id}, -1, this)">👎</button>
            </div>
          ` : ''}
        </div>
      `;

      row.innerHTML = `
        <div class="msg-avatar">🤖</div>
        <div class="msg-bubble">
          ${formatText(data.answer)}
          ${sourcesHtml}
          ${metaHtml}
        </div>
      `;
      chatContainer.appendChild(row);
      scrollToBottom();
    }

    function appendTypingIndicator() {
      const row = document.createElement('div');
      row.className = 'message-row bot';
      row.innerHTML = `
        <div class="msg-avatar">🤖</div>
        <div class="msg-bubble">
          <div class="typing-dots">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      `;
      chatContainer.appendChild(row);
      return row;
    }

    async function sendFeedback(interactionId, value, btn) {
      try {
        const group = btn.closest('.feedback-group');
        const buttons = group.querySelectorAll('button');
        buttons.forEach(b => b.disabled = true);

        const resp = await fetch('/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ interaction_id: interactionId, feedback: value })
        });

        if (resp.ok) {
          group.innerHTML = `<span style="color:#10b981; font-weight:600;">✓ ¡Gracias por tu feedback!</span>`;
        }
      } catch (e) {
        console.error('Error enviando feedback:', e);
      }
    }

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  </script>

</body>
</html>
